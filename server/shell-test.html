<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shell 通讯测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0d1117; color: #c9d1d9;
    display: flex; flex-direction: column;
  }
  header {
    padding: 12px 16px;
    background: #161b22; border-bottom: 1px solid #21262d;
    display: flex; align-items: center; gap: 10px;
  }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: #484f58; }
  header .dot.ok { background: #3fb950; }
  header .dot.bad { background: #f85149; }
  header b { font-size: 14px; }
  header span { font-size: 11.5px; color: #8b949e; }
  #term {
    flex: 1; overflow-y: auto; padding: 14px 16px;
    font-family: Consolas, Menlo, monospace; font-size: 12.5px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-all;
  }
  .cmd { color: #79c0ff; }
  .out { color: #c9d1d9; }
  .err { color: #f85149; }
  .hint { color: #8b949e; }
  .quick { padding: 8px 12px; display: flex; gap: 8px; overflow-x: auto; background: #161b22; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button {
    flex-shrink: 0; padding: 6px 12px; font-size: 11.5px;
    color: #c9d1d9; background: #21262d; border: 1px solid #30363d;
    border-radius: 999px; cursor: pointer;
  }
  .quick button:active { background: #30363d; }
  .inputbar {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: #161b22; border-top: 1px solid #21262d;
  }
  #cmd {
    flex: 1; padding: 11px 13px; font-size: 13.5px; font-family: Consolas, monospace;
    color: #e6edf3; background: #0d1117; border: 1px solid #30363d; border-radius: 9px; outline: none;
  }
  #cmd:focus { border-color: #1f6feb; }
  #send {
    padding: 0 20px; font-size: 14px; font-weight: 600;
    color: #fff; background: #238636; border: none; border-radius: 9px; cursor: pointer;
  }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <div id="dot" class="dot"></div>
  <b>Shell 通讯测试</b>
  <span id="status">检测桥接中…</span>
</header>

<div id="term"></div>

<div class="quick" id="quick"></div>

<div class="inputbar">
  <input id="cmd" placeholder="输入 shell 命令…" autocomplete="off" spellcheck="false">
  <button id="send">执行</button>
</div>

<script>
var term = document.getElementById('term');
var input = document.getElementById('cmd');
var send = document.getElementById('send');
var dot = document.getElementById('dot');
var status = document.getElementById('status');
var history = [];
var hIndex = -1;
var busy = false;

var QUICK = ['id', 'whoami', 'getprop ro.product.model', 'cat /data/misc/bbksn', 'ls /', 'df -h'];

function print(text, cls) {
  var div = document.createElement('div');
  div.className = cls || 'out';
  div.textContent = text;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
}

function esc(s) { return String(s == null ? '' : s); }

// ---- 页面自带桥接封装（原生固定回调 window.__shellCb）----
var pending = {};
window.__shellCb = function (id, result) {
  var r = pending[id];
  if (r) { delete pending[id]; r(result); }
};
function execAsync(cmd) {
  return new Promise(function (resolve) {
    var id = 'cb' + Date.now() + Math.floor(Math.random() * 100000);
    pending[id] = resolve;
    SystemToolbox.exec(cmd, id);
  });
}

// ---- 轮询等待原生桥 ----
var bridgeReady = false;
function waitBridge(cb) {
  var tries = 0;
  (function poll() {
    if (window.SystemToolbox && SystemToolbox.exec) { cb(true); return; }
    if (++tries > 50) { cb(false); return; }
    setTimeout(poll, 100);
  })();
}

function runCommand(cmd) {
  if (!cmd || busy) return;
  if (!bridgeReady) return;
  busy = true; send.disabled = true;
  history.push(cmd); hIndex = history.length;
  print('$ ' + cmd, 'cmd');
  var t0 = Date.now();
  execAsync(cmd).then(function (out) {
    var ms = Date.now() - t0;
    var text = esc(out).replace(/\n$/, '');
    print(text === '' ? '(无输出)' : text, /^ERROR:/.test(text) ? 'err' : 'out');
    print('─ 退出 · ' + ms + 'ms', 'hint');
    busy = false; send.disabled = false;
    input.focus();
  });
}

// 同步桥测试
function runSync() {
  if (!bridgeReady) return;
  print('$ SystemToolbox.run("echo sync-ok")', 'cmd');
  try {
    var out = SystemToolbox.run('echo sync-ok');
    print(esc(out).replace(/\n$/, ''), 'out');
  } catch (e) {
    print('同步调用异常: ' + e, 'err');
  }
}

// 快捷按钮
QUICK.forEach(function (cmd) {
  var b = document.createElement('button');
  b.textContent = cmd;
  b.onclick = function () { input.value = cmd; runCommand(cmd); };
  document.getElementById('quick').appendChild(b);
});
var syncBtn = document.createElement('button');
syncBtn.textContent = '同步测试';
syncBtn.onclick = runSync;
document.getElementById('quick').appendChild(syncBtn);

send.onclick = function () { runCommand(input.value.trim()); input.value = ''; };

input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { runCommand(input.value.trim()); input.value = ''; }
  if (e.key === 'ArrowUp' && hIndex > 0) { hIndex--; input.value = history[hIndex]; }
  if (e.key === 'ArrowDown') {
    if (hIndex < history.length - 1) { hIndex++; input.value = history[hIndex]; }
    else { hIndex = history.length; input.value = ''; }
  }
});

print('=== Shell 通讯测试终端 ===', 'hint');
waitBridge(function (ok) {
  if (ok) {
    bridgeReady = true;
    dot.className = 'dot ok';
    status.textContent = '桥接就绪';
    print('SystemToolbox 桥接已连接，输入命令开始测试。', 'hint');
  } else {
    dot.className = 'dot bad';
    status.textContent = '桥接不可用';
    print('未检测到 SystemToolbox 桥接。', 'err');
    print('请通过 App 底部栏「更多」页打开本页面。', 'hint');
  }
});
</script>
</body>
</html>
